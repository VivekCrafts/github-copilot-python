<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty-select" class="difficulty-label">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
    <button id="dark-mode-toggle">Dark Mode</button>
    <span id="timer">Time: 00:00</span>
    <span id="message"></span>
  </div>
  <div class="score-panel">
    <input id="player-name" type="text" maxlength="20" placeholder="Your name">
    <button id="save-score">Save Score</button>
  </div>
  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <ol id="leaderboard-list"></ol>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
